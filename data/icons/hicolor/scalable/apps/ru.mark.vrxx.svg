<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Top Surface Gradient (Adwaita Blue 1 -> Blue 3) -->
    <linearGradient id="shieldGrad" x1="64" y1="14" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#3584e4"/>
    </linearGradient>
    <!-- HIG Front Profile Dark Gradient (Adwaita Blue 4 -> Blue 5) -->
    <linearGradient id="frontGrad" x1="64" y1="112" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <!-- HIG Front Profile (3D 4px Depth Lip at bottom baseline y=116) -->
  <path d="M 20 32 C 20 24 64 16 64 16 C 64 16 108 24 108 32 C 108 72 100 102 64 116 C 28 102 20 72 20 32 Z"
        fill="url(#frontGrad)"/>

  <!-- HIG Top Surface (Main Shield) -->
  <path d="M 20 30 C 20 22 64 14 64 14 C 64 14 108 22 108 30 C 108 68 100 98 64 112 C 28 98 20 68 20 30 Z"
        fill="url(#shieldGrad)"/>

  <!-- Inner Highlight Rim -->
  <path d="M 22 31 C 22 24 64 16 64 16 C 64 16 106 24 106 31 C 106 67 98 96 64 110 C 30 96 22 67 22 31 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Checkmark Badge Base (White Outline for contrast) -->
  <path d="M 38 60 L 56 78 L 90 42"
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark Badge Top (Adwaita Green 33d17a) -->
  <path d="M 38 60 L 56 78 L 90 42"
        fill="none" stroke="#33d17a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
