<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="ru.mark.vrxx.daemon"/>
  </policy>

  <!-- Allow anyone to invoke methods on the service -->
  <policy context="default">
    <allow send_destination="ru.mark.vrxx.daemon"/>
    <allow receive_sender="ru.mark.vrxx.daemon"/>
  </policy>
</busconfig>
