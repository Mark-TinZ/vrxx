[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,-z,noexecstack",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,-z,noexecstack",
]
