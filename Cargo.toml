[package]
name = "vrxx"
version = "0.1.5"
edition = "2021"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.44"
dirs = "6.0.0"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.10", package = "gtk4", features = ["v4_16"] }
nix = { version = "0.31.2", features = ["signal"] }
percent-encoding = "2.3.2"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
url = "2.5.8"

[dependencies.adw]
package = "libadwaita"
version = "0.8"
features = ["v1_7"]

[dependencies.gdk]
package = "gdk4"
version = "0.10"
