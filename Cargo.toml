[package]
name = "vrxx"
version = "0.1.5"
edition = "2021"

[dependencies]
base64 = "0.22.1"
dirs = "6.0.0"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
percent-encoding = "2.3.2"
regex = "1.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]

[dependencies.gdk]
package = "gdk4"
version = "0.9"
