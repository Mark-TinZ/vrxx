[package]
name = "vrxx"
version = "26.1.0-beta.3"
edition = "2021"
default-run = "vrxx"
description = "Fast, modern Linux GTK4/Libadwaita GUI and TUI client for sing-box"
authors = ["Mark"]
license = "MPL-2.0"
repository = "https://github.com/Mark-TinZ/vrxx"
homepage = "https://github.com/Mark-TinZ/vrxx"
readme = "README.md"
categories = ["network-programming", "gui"]
keywords = ["vpn", "proxy", "sing-box", "gtk4", "libadwaita"]

[dependencies]
base64 = "0.22.1"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chrono = "0.4.44"
dirs = "6.0.0"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
nix = { version = "0.31.2", features = ["signal", "user"] }
percent-encoding = "2.3.2"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
url = "2.5.8"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["socks", "json", "rustls-tls-native-roots"], default-features = false }
tokio = { version = "1", features = ["full"] }
ureq = { version = "2.9", features = ["socks-proxy", "json"] }
async-channel = "2.3"
futures-util = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.4"
clap = { version = "4.5", features = ["derive"] }
tun-rs = { version = "2.8.2", features = ["async"] }
rtnetlink = "0.20.0"
ipnet = "2.12.0"
axum = { version = "0.8.9", features = ["default"] }
axum-extra = { version = "0.12.6", features = ["default"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
reqwest-eventsource = "0.6.0"
zbus = { version = "5.15.0", features = ["tokio"] }
ratatui = "0.29"
crossterm = "0.28"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }



[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_5"]

[dependencies.gdk]
package = "gdk4"
version = "0.9"

[package.metadata.deb]
name = "vrxx"
maintainer = "Mark <https://github.com/Mark-TinZ/vrxx>"
copyright = "2026 Mark"
license-file = ["COPYING", "0"]
depends = "$auto, libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5), polkitd | policykit-1"
section = "net"
priority = "optional"
extended-description = """\
VRXX is a modern, native Linux graphical interface and TUI for sing-box designed to simplify VPN and proxy configuration with support for VLESS, VMess, Shadowsocks, Trojan, WireGuard, Hysteria2, TUIC, and SOCKS5/HTTP."""
assets = [
    ["target/release/vrxx", "usr/bin/vrxx", "755"],
    ["target/release/vrxx-tui", "usr/bin/vrxx-tui", "755"],
    ["data/ru.mark.vrxx.desktop", "usr/share/applications/ru.mark.vrxx.desktop", "644"],
    ["data/ru.mark.vrxx.metainfo.xml", "usr/share/metainfo/ru.mark.vrxx.metainfo.xml", "644"],
    ["data/ru.mark.vrxx.gschema.xml", "usr/share/glib-2.0/schemas/ru.mark.vrxx.gschema.xml", "644"],
    ["data/ru.mark.vrxx.policy", "usr/share/polkit-1/actions/ru.mark.vrxx.policy", "644"],
    ["data/ru.mark.vrxx.daemon.conf", "usr/share/dbus-1/system.d/ru.mark.vrxx.daemon.conf", "644"],
    ["data/icons/hicolor/scalable/apps/ru.mark.vrxx.svg", "usr/share/icons/hicolor/scalable/apps/ru.mark.vrxx.svg", "644"],
    ["data/icons/hicolor/symbolic/apps/ru.mark.vrxx-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/ru.mark.vrxx-symbolic.svg", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vrxx", dest = "/usr/bin/vrxx", mode = "755" },
    { source = "target/release/vrxx-tui", dest = "/usr/bin/vrxx-tui", mode = "755" },
    { source = "data/ru.mark.vrxx.desktop", dest = "/usr/share/applications/ru.mark.vrxx.desktop", mode = "644" },
    { source = "data/ru.mark.vrxx.metainfo.xml", dest = "/usr/share/metainfo/ru.mark.vrxx.metainfo.xml", mode = "644" },
    { source = "data/ru.mark.vrxx.gschema.xml", dest = "/usr/share/glib-2.0/schemas/ru.mark.vrxx.gschema.xml", mode = "644" },
    { source = "data/ru.mark.vrxx.policy", dest = "/usr/share/polkit-1/actions/ru.mark.vrxx.policy", mode = "644" },
    { source = "data/ru.mark.vrxx.daemon.conf", dest = "/usr/share/dbus-1/system.d/ru.mark.vrxx.daemon.conf", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/ru.mark.vrxx.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ru.mark.vrxx.svg", mode = "644" },
    { source = "data/icons/hicolor/symbolic/apps/ru.mark.vrxx-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/ru.mark.vrxx-symbolic.svg", mode = "644" },
]
