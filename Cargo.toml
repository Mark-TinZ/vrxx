[package]
name = "vrxx"
version = "26.1.0-beta.2"
edition = "2021"
default-run = "vrxx"

[dependencies]
base64 = "0.22.1"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chrono = "0.4.44"
dirs = "6.0.0"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
nix = { version = "0.31.2", features = ["signal", "user"] }
percent-encoding = "2.3.2"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
url = "2.5.8"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["socks", "json", "rustls-tls-native-roots"], default-features = false }
tokio = { version = "1", features = ["full"] }
ureq = { version = "2.9", features = ["socks-proxy", "json"] }
async-channel = "2.3"
futures-util = "0.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.4"
clap = { version = "4.5", features = ["derive"] }
tun-rs = { version = "2.8.2", features = ["async"] }
rtnetlink = "0.20.0"
ipnet = "2.12.0"
axum = { version = "0.8.9", features = ["default"] }
axum-extra = { version = "0.12.6", features = ["default"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
reqwest-eventsource = "0.6.0"
zbus = { version = "5.15.0", features = ["tokio"] }
ratatui = "0.29"
crossterm = "0.28"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }



[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_5"]

[dependencies.gdk]
package = "gdk4"
version = "0.9"

[package.metadata.release]
pre-release-commit-message = "chore(release): bump version to {{version}}"
tag-message = "chore(release): {{version}}"
tag-name = "v{{version}}"
sign-commit = false
sign-tag = false
pre-release-replacements = [
  {file = "meson.build", search = "version: '[0-9a-zA-Z.-]+'", replace = "version: '{{version}}'"},
  {file = "data/ru.mark.vrxx.metainfo.xml.in", search = '<release version="[0-9a-zA-Z.-]+"', replace = '<release version="{{version}}"'}
]
