name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev meson gettext libssl-dev pkg-config locales locales-all rpm desktop-file-utils appstream

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo packaging tools
        run: |
          which cargo-deb || cargo install cargo-deb --locked
          which cargo-generate-rpm || cargo install cargo-generate-rpm --locked

      - name: Build Release Binaries
        run: |
          cargo build --release --bin vrxx --bin vrxx-tui

      - name: Prepare Assets & Metainfo
        run: |
          cp data/ru.mark.vrxx.desktop.in data/ru.mark.vrxx.desktop
          cp data/ru.mark.vrxx.metainfo.xml.in data/ru.mark.vrxx.metainfo.xml

      - name: Build DEB Package
        run: |
          cargo deb --no-build
          mkdir -p release-assets
          cp target/debian/*.deb release-assets/

      - name: Build RPM Package
        run: |
          cargo generate-rpm
          cp target/generate-rpm/*.rpm release-assets/

      - name: Prepare Universal Archive & Arch PKGBUILD
        env:
          SINGBOX_VERSION: "1.13.18"
        run: |
          rm -rf dist vrxx-linux-x86_64
          BUNDLE_DIR="dist/vrxx-linux-x86_64"
          mkdir -p "${BUNDLE_DIR}"

          # 1. Копируем бинарники VRXX (GUI и TUI)
          cp target/release/vrxx "${BUNDLE_DIR}/vrxx"
          cp target/release/vrxx-tui "${BUNDLE_DIR}/vrxx-tui"
          chmod +x "${BUNDLE_DIR}/vrxx" "${BUNDLE_DIR}/vrxx-tui"

          # 2. Скачиваем официальный бинарник ядра sing-box 1.13.18
          curl -fSL --retry 3 --retry-delay 2 -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          cp "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" "${BUNDLE_DIR}/sing-box"
          chmod +x "${BUNDLE_DIR}/sing-box"
          rm -rf sing-box.tar.gz "sing-box-${SINGBOX_VERSION}-linux-amd64"

          # 3. Копируем иконки, .desktop файл, polkit, dbus, лицензию и README
          mkdir -p "${BUNDLE_DIR}/icons"
          cp -r data/icons/* "${BUNDLE_DIR}/icons/"
          cp data/ru.mark.vrxx.desktop "${BUNDLE_DIR}/ru.mark.vrxx.desktop"
          cp data/ru.mark.vrxx.metainfo.xml "${BUNDLE_DIR}/ru.mark.vrxx.metainfo.xml"
          cp data/ru.mark.vrxx.policy "${BUNDLE_DIR}/ru.mark.vrxx.policy"
          cp data/ru.mark.vrxx.daemon.conf "${BUNDLE_DIR}/ru.mark.vrxx.daemon.conf"
          cp README.md "${BUNDLE_DIR}/README.md"
          cp COPYING "${BUNDLE_DIR}/COPYING"

          # 4. Создаем скрипт установки install.sh для архива
          cat << 'EOF' > "${BUNDLE_DIR}/install.sh"
          #!/bin/bash
          set -e
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          NC='\033[0m'
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          echo -e "${BLUE}🚀 Установка VRXX в систему...${NC}"
          sudo install -m 755 "${SCRIPT_DIR}/vrxx" /usr/local/bin/vrxx
          if [ -f "${SCRIPT_DIR}/vrxx-tui" ]; then
              sudo install -m 755 "${SCRIPT_DIR}/vrxx-tui" /usr/local/bin/vrxx-tui
          fi
          if [ -f "${SCRIPT_DIR}/sing-box" ]; then
              sudo install -m 755 "${SCRIPT_DIR}/sing-box" /usr/local/bin/sing-box
          fi
          sudo mkdir -p /usr/share/icons/hicolor/scalable/apps/
          sudo mkdir -p /usr/share/icons/hicolor/symbolic/apps/
          if [ -f "${SCRIPT_DIR}/icons/hicolor/scalable/apps/ru.mark.vrxx.svg" ]; then
              sudo install -m 644 "${SCRIPT_DIR}/icons/hicolor/scalable/apps/ru.mark.vrxx.svg" /usr/share/icons/hicolor/scalable/apps/ru.mark.vrxx.svg
          fi
          if [ -f "${SCRIPT_DIR}/icons/hicolor/symbolic/apps/ru.mark.vrxx-symbolic.svg" ]; then
              sudo install -m 644 "${SCRIPT_DIR}/icons/hicolor/symbolic/apps/ru.mark.vrxx-symbolic.svg" /usr/share/icons/hicolor/symbolic/apps/ru.mark.vrxx-symbolic.svg
          fi
          sudo mkdir -p /usr/share/applications/
          if [ -f "${SCRIPT_DIR}/ru.mark.vrxx.desktop" ]; then
              sudo install -m 644 "${SCRIPT_DIR}/ru.mark.vrxx.desktop" /usr/share/applications/ru.mark.vrxx.desktop
          fi
          sudo mkdir -p /usr/share/metainfo/
          if [ -f "${SCRIPT_DIR}/ru.mark.vrxx.metainfo.xml" ]; then
              sudo install -m 644 "${SCRIPT_DIR}/ru.mark.vrxx.metainfo.xml" /usr/share/metainfo/ru.mark.vrxx.metainfo.xml
          fi
          sudo mkdir -p /usr/share/polkit-1/actions/
          if [ -f "${SCRIPT_DIR}/ru.mark.vrxx.policy" ]; then
              sudo install -m 644 "${SCRIPT_DIR}/ru.mark.vrxx.policy" /usr/share/polkit-1/actions/ru.mark.vrxx.policy
          fi
          sudo mkdir -p /usr/share/dbus-1/system.d/
          if [ -f "${SCRIPT_DIR}/ru.mark.vrxx.daemon.conf" ]; then
              sudo install -m 644 "${SCRIPT_DIR}/ru.mark.vrxx.daemon.conf" /usr/share/dbus-1/system.d/ru.mark.vrxx.daemon.conf
          fi

          command -v gtk-update-icon-cache >/dev/null 2>&1 && sudo gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true
          command -v update-desktop-database >/dev/null 2>&1 && sudo update-desktop-database /usr/share/applications || true
          echo -e "${GREEN}✅ VRXX успешно установлен и готов к работе!${NC}"
          EOF
          chmod +x "${BUNDLE_DIR}/install.sh"

          # 5. Создаем скрипт удаления uninstall.sh для архива
          cat << 'EOF' > "${BUNDLE_DIR}/uninstall.sh"
          #!/bin/bash
          set -e
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          NC='\033[0m'

          echo -e "${RED}🗑️ Удаление VRXX из системы...${NC}"
          if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl disable --now vrxx-daemon.service 2>/dev/null || true
              sudo rm -f /etc/systemd/system/vrxx-daemon.service
              sudo systemctl daemon-reload 2>/dev/null || true
          fi
          sudo rm -f /usr/local/bin/vrxx /usr/local/bin/vrxx-tui
          sudo rm -f /usr/share/icons/hicolor/scalable/apps/ru.mark.vrxx.svg
          sudo rm -f /usr/share/icons/hicolor/symbolic/apps/ru.mark.vrxx-symbolic.svg
          sudo rm -f /usr/share/applications/ru.mark.vrxx.desktop
          sudo rm -f /usr/share/metainfo/ru.mark.vrxx.metainfo.xml
          sudo rm -f /usr/share/polkit-1/actions/ru.mark.vrxx.policy
          sudo rm -f /usr/share/dbus-1/system.d/ru.mark.vrxx.daemon.conf
          command -v gtk-update-icon-cache >/dev/null 2>&1 && sudo gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true
          command -v update-desktop-database >/dev/null 2>&1 && sudo update-desktop-database /usr/share/applications || true
          echo -e "${GREEN}✅ VRXX удален из системы.${NC}"
          EOF
          chmod +x "${BUNDLE_DIR}/uninstall.sh"

          # 6. Упаковываем tar.gz универсальный архив
          tar -czf release-assets/vrxx-linux-x86_64.tar.gz -C dist vrxx-linux-x86_64

          # 7. Копируем PKGBUILD для Arch Linux
          cp pkg/arch/PKGBUILD release-assets/PKGBUILD

          # 8. Генерируем SHA256 контрольные суммы для всех файлов релизов
          cd release-assets
          for f in *; do
              if [ -f "$f" ] && [[ "$f" != *.sha256 ]]; then
                  sha256sum "$f" > "${f}.sha256"
              fi
          done
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vrxx-packages
          path: release-assets/*

      - name: Extract Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -c '
          import sys, re
          tag = sys.argv[1]
          version = tag.lstrip("v")
          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  text = f.read()
              pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              if match and match.group(1).strip():
                  notes = match.group(1).strip()
              else:
                  notes = f"Release {tag}"
          except Exception:
              notes = f"Release {tag}"

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as out:
              out.write(notes + "\n")
          ' "$REF_NAME"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !env.ACT
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
