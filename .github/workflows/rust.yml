name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install GTK4 dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gettext xvfb


    - name: Run Cargo Check
      run: cargo check --verbose

    - name: Run Cargo Test
      run: xvfb-run cargo test --verbose

    - name: Run Cargo Clippy
      run: cargo clippy -- -D warnings