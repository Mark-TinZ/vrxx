name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Install GTK4 dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gettext xvfb libssl-dev pkg-config locales locales-all

    - name: Install sing-box for integration tests
      env:
        SINGBOX_VERSION: "1.13.18"
      run: |
        curl -fSL --retry 3 --retry-delay 2 -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
        tar -xzf sing-box.tar.gz
        sudo install -m 755 "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
        rm -rf sing-box.tar.gz "sing-box-${SINGBOX_VERSION}-linux-amd64"
        sing-box version

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Run Cargo Check
      run: cargo check --all-targets --verbose

    - name: Build All Targets
      run: cargo build --all-targets --verbose

    - name: Run Cargo Test
      run: xvfb-run cargo test --all-targets --verbose

    - name: Run Cargo Clippy
      run: cargo clippy --all-targets -- -D warnings
