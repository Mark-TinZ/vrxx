name: Security & Quality Analysis (DevSecOps)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly scan on Mondays at 04:00 UTC for new CVEs and supply-chain threats
    - cron: '0 4 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  # ==========================================
  # 1. GITLEAKS - Secret & Credential Scanning
  # ==========================================
  gitleaks:
    name: Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          GITLEAKS_SHA256="cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect --source . -v --redact --config .gitleaks.toml --report-format json --report-path gitleaks-report.json

      - name: Upload Gitleaks Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # ==========================================
  # 2. SEMGREP - Static Application Security Testing
  # ==========================================
  semgrep:
    name: Semgrep SAST (Rust Security & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config "p/secrets" \
            --config "p/security-audit" \
            --sarif-output=semgrep.sarif \
            --error \
            --metrics=off

      - name: Upload Semgrep SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  # ==========================================
  # 3. CARGO AUDIT - RustSec Vulnerability Scanner
  # ==========================================
  cargo-audit:
    name: Cargo Audit (RustSec CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # 4. CARGO DENY - Licenses & Bans
  # ==========================================
  cargo-deny:
    name: Cargo Deny (Licenses & Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ==========================================
  # 5. TRIVY - CVE & SCA Vulnerability Scanner
  # ==========================================
  trivy:
    name: Trivy (SCA & Filesystem CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy.sarif'

      - name: Upload Trivy SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: ignore

  # ==========================================
  # 6. BINARY HARDENING (checksec)
  # ==========================================
  checksec:
    name: Binary Hardening Verification (checksec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & checksec
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gettext xvfb libssl-dev pkg-config checksec

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: cargo build --release --bin vrxx --bin vrxx-tui

      - name: Verify Binary Hardening with checksec
        run: |
          checksec --file=target/release/vrxx --format=json
          checksec --file=target/release/vrxx-tui --format=json
