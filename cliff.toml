# cliff.toml
#
# git-cliff configuration for VRXX
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Журнал изменений (Changelog)

Все изменения проекта документируются в соответствии с [Conventional Commits](https://www.conventionalcommits.org/).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Неопубликовано]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- Generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Новые возможности" },
    { message = "^fix", group = "<!-- 1 -->🐛 Исправления ошибок" },
    { message = "^perf", group = "<!-- 2 -->⚡ Производительность" },
    { message = "^refactor", group = "<!-- 3 -->🚜 Рефакторинг" },
    { message = "^style", group = "<!-- 4 -->🎨 Стилизация и UI" },
    { message = "^doc", group = "<!-- 5 -->📚 Документация" },
    { message = "^test", group = "<!-- 6 -->🧪 Тестирование" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "<!-- 7 -->📦 Зависимости" },
    { message = "^chore|^ci", group = "<!-- 8 -->🔧 Обслуживание и CI" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
